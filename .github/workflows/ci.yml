# The public repository's checks: the whole workspace's tests, in release,
# on Linux, Windows and macOS. No secrets and a read-only token. Tests that
# need something outside the repository (the private leak denylist, a real
# configuration, the embedding model) skip themselves when it is absent, as
# they do on any machine without it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Only the public repository runs it: the development repository
    # carries the same file and verifies locally.
    if: github.repository == 'bloodfeast/atlas'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml names the toolchain; rustup installs it on the
      # first cargo call.
      - name: Test
        run: cargo test --workspace --release --locked
        env:
          CARGO_TERM_COLOR: always
          CARGO_BUILD_JOBS: 4
  clippy:
    # Same rule as the tests. On a pinned toolchain, so a new Rust release's
    # lints cannot fail an unrelated release: bump it in xtask/src/release.rs too.
    if: github.repository == 'bloodfeast/atlas'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned clippy
        run: rustup toolchain install 1.99.0 --profile minimal -c clippy
      - name: Clippy, all targets with dev
        run: cargo +1.99.0 clippy --workspace --locked --all-targets --features atlas/dev -- -D warnings
        env:
          CARGO_TERM_COLOR: always
          CARGO_BUILD_JOBS: 4
      - name: Clippy, default targets
        run: cargo +1.99.0 clippy --workspace --locked -- -D warnings
        env:
          CARGO_TERM_COLOR: always
          CARGO_BUILD_JOBS: 4
